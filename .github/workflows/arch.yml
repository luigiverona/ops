name: Arch integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - script/install.sh
      - .github/workflows/arch.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Prepare disposable Arch container
        run: pacman -Syu --noconfirm git go openssh gnupg
      - uses: actions/checkout@v4
      - name: Test on official Arch
        run: go test ./...
      - name: Build Linux x86_64 binary
        run: go build ./cmd/ops
      - name: Validate installer syntax
        run: sh -n script/install.sh

