name: Arch integration

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  arch-integration:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      GOENV: off
      GOTOOLCHAIN: local
    steps:
      - name: Prepare disposable Arch container
        run: pacman -Syu --noconfirm diffutils git openssh gnupg
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.7'
          cache: true
      - name: Verify toolchain
        run: test "$(go env GOVERSION)" = go1.26.7
      - name: Trust checked-out workspace in the disposable container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Test on official Arch
        run: go test ./...
      - name: Build Linux x86_64 binary
        run: go build ./cmd/ops
      - name: Validate installer syntax
        run: sh -n script/install.sh script/prepare-release.sh script/render-install.sh
