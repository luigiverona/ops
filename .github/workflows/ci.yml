name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    container:
      # Keep the same official base image as the independent minimal runtime.
      image: archlinux:base@sha256:818793c894d94534c22f2149154a39ebaee57e4e67321023b0866a1d5722036c
      # Default seccomp denies nested namespaces; docker-default AppArmor denies
      # their mounts (bwrap: Failed to make / slave: Permission denied).
      # Retain default capabilities: no SYS_ADMIN or privileged container.
      options: --security-opt seccomp=unconfined --security-opt apparmor=unconfined
    defaults:
      run:
        # Native permission tests must run as an ordinary workstation user.
        shell: runuser -u ops-ci -- bash --noprofile --norc -e -o pipefail {0}
    env:
      GOENV: off
      GOTOOLCHAIN: local
      GOPATH: /home/ops-ci/go
      GOCACHE: /home/ops-ci/.cache/go-build
      XDG_RUNTIME_DIR: /run/user/1000
    steps:
      - name: Bootstrap Arch native test environment
        shell: bash
        run: |
          # Full upgrade, never a partial Arch upgrade. git precedes checkout.
          # pacman also supplies vercmp and pacman-conf; libarchive supplies bsdtar.
          # OpenSSH, Python and util-linux exercise agent, PTY and namespace tests.
          # diffutils supplies cmp for the release-script fixtures.
          pacman -Syu --needed --noconfirm \
            archlinux-keyring pacman gnupg libarchive bubblewrap flatpak \
            git gcc openssh python util-linux diffutils
          useradd --create-home --uid 1000 ops-ci
          install -d -m 0700 -o ops-ci -g ops-ci /run/user/1000
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.7'
          cache: true
      - name: Prepare unprivileged validation
        shell: bash
        run: chown -R ops-ci:ops-ci "$GITHUB_WORKSPACE" /home/ops-ci
      - name: Verify native Arch dependencies
        run: |
          test "$(id -u)" = 1000
          cat /etc/os-release
          . /etc/os-release
          test "$ID" = arch
          for tool in pacman pacman-conf vercmp gpg gpgconf bsdtar bwrap flatpak git gcc ssh ssh-keygen ssh-agent ssh-add python3 script unshare mount cmp; do
            command -v "$tool"
            pacman -Qo "$(command -v "$tool")"
          done
          for keyring in archlinux.gpg archlinux-trusted archlinux-revoked; do
            test -r "/usr/share/pacman/keyrings/$keyring"
            pacman -Qo "/usr/share/pacman/keyrings/$keyring"
          done
          pacman --version
          bsdtar --version
          bwrap --version
          flatpak --version
          gcc --version
      - name: Verify toolchain
        run: |
          test "$(go env GOVERSION)" = go1.26.7
          test "$(go version)" = 'go version go1.26.7 linux/amd64'
          test "$GOENV" = off
          test "$(go env GOTOOLCHAIN)" = local
          go version
          printf 'GOENV=%s GOTOOLCHAIN=%s\n' "$GOENV" "$GOTOOLCHAIN"
          go env GOENV GOTOOLCHAIN CGO_ENABLED
          go mod verify
      - name: Native Arch regressions
        run: go test -v -count=1 ./internal/resolve -run '^TestReal(PacmanProviderPrintFormatInIsolatedDatabase|VerCmpArchVersionSemantics)$'
      - name: Native Flatpak tests
        env:
          GOFLAGS: -v
        run: go test -count=1 ./internal/flatpak
      - name: Verify namespace boundary
        if: ${{ !cancelled() }}
        run: |
          status=0
          unshare --user --map-root-user --mount --propagation private -- /bin/true || status=$?
          bwrap --unshare-all --die-with-parent --new-session --ro-bind / / --proc /proc -- cat /etc/os-release || status=$?
          exit "$status"
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        env:
          GOFLAGS: -v
        run: |
          go test -count=1 ./... | tee /home/ops-ci/test.log
          # Only the separately opt-in network integration may skip.
          if grep -E '^[[:space:]]*--- SKIP:' /home/ops-ci/test.log | grep -v -- '--- SKIP: TestOfficialArchIntegration '; then
            echo 'Unexpected test skip' >&2
            exit 1
          fi
      - name: Race test
        env:
          GOFLAGS: -v
        run: |
          go test -race -count=1 -timeout=30m ./... | tee /home/ops-ci/race.log
          if grep -E '^[[:space:]]*--- SKIP:' /home/ops-ci/race.log | grep -v -- '--- SKIP: TestOfficialArchIntegration '; then
            echo 'Unexpected race test skip' >&2
            exit 1
          fi
      - name: Build
        run: go build ./...
      - name: Validate shell syntax
        run: sh -n script/install.sh script/prepare-release.sh script/render-install.sh script/publish-release.sh script/test-minimal-arch.sh
