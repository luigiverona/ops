name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    # The host policy below specifically targets Ubuntu 24.04 user namespaces.
    runs-on: ubuntu-24.04
    env:
      GOENV: off
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.7'
          # Only provision the toolchain here; caches live inside Arch.
          cache: false
      - name: Verify host and capture exact Go toolchain
        run: |
          cat /etc/os-release
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 24.04
          test "$(go env GOVERSION)" = go1.26.7
          test "$(go version)" = 'go version go1.26.7 linux/amd64'
          printf 'CI_GOROOT=%s\n' "$(realpath "$(go env GOROOT)")" >> "$GITHUB_ENV"
      - name: Load reviewed Ubuntu bwrap user-namespace policy
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          test "$(sysctl -n kernel.unprivileged_userns_clone)" = 1
          sudo apt-get update
          sudo apt-get install --yes apparmor apparmor-utils apparmor-profiles
          dpkg-query -W apparmor apparmor-utils apparmor-profiles
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -f "$profile"
          dpkg-query -S "$profile"
          cat "$profile"
          # Reviewed Ubuntu package policy: only /usr/bin/bwrap attaches;
          # sandbox children stack unpriv_bwrap, which denies capabilities.
          # Fail closed if the supplied policy changes and needs fresh review.
          printf '%s  %s\n' 11d39094f044f0cda0febb3ad517b830301da6b2ce929664af09ee9e4dd264f9 "$profile" | sha256sum --check
          test ! -e /etc/apparmor.d/local/bwrap-userns-restrict
          test ! -e /etc/apparmor.d/local/unpriv_bwrap
          test "$(sudo apparmor_parser --names "$profile")" = "$(printf 'bwrap\nunpriv_bwrap')"
          # Never replace or later unload a profile owned by the runner.
          sudo cat /sys/kernel/security/apparmor/profiles > "$RUNNER_TEMP/ops-apparmor-before"
          if grep -Eq '^(bwrap|unpriv_bwrap)(//| )' "$RUNNER_TEMP/ops-apparmor-before"; then
            echo 'bwrap policy already loaded; refusing to replace host policy' >&2
            exit 1
          fi
          touch "$RUNNER_TEMP/ops-bwrap-policy-owned"
          sudo apparmor_parser --add "$profile"
          sudo aa-status
          sudo cat /sys/kernel/security/apparmor/profiles > "$RUNNER_TEMP/ops-apparmor-loaded"
          grep -Fx 'bwrap (enforce)' "$RUNNER_TEMP/ops-apparmor-loaded"
          grep -Fx 'unpriv_bwrap (enforce)' "$RUNNER_TEMP/ops-apparmor-loaded"
      - name: Run native Arch validation as UID 1000
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          test "$(sysctl -n kernel.unprivileged_userns_clone)" = 1
          # Default seccomp blocks nested namespaces. docker-default inherits
          # its file execution policy and denies mounts, preventing bwrap's
          # executable profile transition. Start unconfined so /usr/bin/bwrap
          # attaches to the packaged policy; the helper MUST prove attachment.
          # No added capabilities: retain Docker's normal capability set.
          docker run --rm --platform linux/amd64 \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --mount "type=bind,src=$CI_GOROOT,dst=/opt/go,readonly" \
            --workdir /workspace \
            archlinux:base@sha256:818793c894d94534c22f2149154a39ebaee57e4e67321023b0866a1d5722036c \
            bash /workspace/script/test-ci-arch.sh
      - name: Record AppArmor denials on failure
        if: failure()
        run: sudo journalctl --dmesg --no-pager --grep='apparmor="DENIED"' --lines=100
      - name: Remove only this job's bwrap policy
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/ops-bwrap-policy-owned"; then
            sudo apparmor_parser --remove /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
            rm "$RUNNER_TEMP/ops-bwrap-policy-owned"
            sudo cat /sys/kernel/security/apparmor/profiles > "$RUNNER_TEMP/ops-apparmor-after"
            if grep -Eq '^(bwrap|unpriv_bwrap)(//| )' "$RUNNER_TEMP/ops-apparmor-after"; then
              echo 'Job bwrap policy still loaded' >&2
              exit 1
            fi
          fi
          sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          test "$(sysctl -n kernel.unprivileged_userns_clone)" = 1
